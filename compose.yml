services:
  web:
    build:
      context: ./apps/web/
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules

  api:
    build:
      context: ./apps/api/
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./apps/api:/app
      - go-mod-cache:/go/pkg/mod
    environment:
      CGO_ENABLED: 0
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  go-mod-cache:
  mysql-data:
  web-node-modules:
